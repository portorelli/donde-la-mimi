<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donde La Mimi (pollos asados)</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Inter:wght@400;600&display=swap">
<style>
img{max-width:100%}
/* Layout: one narrow column — poster first, then large tap buttons and the essentials. Single warm "grill" look in both themes. */
:root{
  --bg:#2a160b; --card:#3b1f0e; --fg:#fff6e8; --muted:#e6cfae;
  --accent:#f5c400; --accent-fg:#2a160b; --line:#5a2e14;
  --display:"Baloo 2", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:dark;
}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding-block:20px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.poster{display:block;width:100%;height:auto;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:10px 14px;border-radius:12px;
  font-family:var(--display);font-weight:800;font-size:19px;text-decoration:none;border:2px solid var(--accent);color:var(--accent);background:transparent}
.btn.primary{grid-column:1/-1;background:var(--accent);color:var(--accent-fg);font-size:22px}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:3px}
.btn svg{width:22px;height:22px;flex:none}
.info{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:baseline}
.row dt{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row dd{margin:0;font-weight:600;min-width:0}
.phone{font-variant-numeric:tabular-nums;user-select:all}
.copy{margin-left:8px;font:inherit;font-size:13px;font-weight:600;color:var(--accent);background:none;border:1px solid var(--accent);border-radius:999px;padding:2px 10px;cursor:pointer}
.copy:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
footer{text-align:center;font-family:var(--display);font-size:22px;color:var(--accent);text-wrap:balance}
@media (max-width:380px){.row{grid-template-columns:1fr;gap:0}.actions{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
  <img class="poster" src="afiche.jpg" alt="Afiche de Donde La Mimi (pollos asados): sabor casero, siempre fresco. Av. El Rosal 3811, Maipú. Teléfono 9 6756 3379.">
  <nav class="actions" aria-label="Acciones">
    <a class="btn primary" href="https://www.google.com/maps/search/?api=1&query=Donde%20La%20Mimi%20%28pollos%20asados%29%2C%20Av.%20El%20Rosal%203811%2C%209301306%20Maip%C3%BA%2C%20Regi%C3%B3n%20Metropolitana" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
      Cómo llegar
    </a>
    <a class="btn" href="https://wa.me/56967563379" target="_blank" rel="noopener">WhatsApp</a>
    <a class="btn" href="tel:+56967563379">Llamar</a>
  </nav>
  <dl class="info">
    <div class="row"><dt>Dirección</dt><dd>Av. El Rosal 3811, 9301306 Maipú, Región Metropolitana</dd></div>
    <div class="row"><dt>Teléfono</dt><dd><span class="phone" id="phone">+56 9 6756 3379</span><button class="copy" id="copy" type="button">Copiar</button></dd></div>
    <div class="row"><dt>Horario</dt><dd>Cierra a las 3 p.m.</dd></div>
    <div class="row"><dt>Precio</dt><dd>$5.000–10.000 por persona</dd></div>
    <div class="row"><dt>Opiniones</dt><dd>4,2 ★ en Google (56 opiniones)</dd></div>
  </dl>
  <footer>¡Ven y disfruta el mejor pollo asado!</footer>
</main>
<script>
document.getElementById('copy').addEventListener('click', e => {
  const b = e.currentTarget, t = document.getElementById('phone').textContent;
  const done = () => { b.textContent = 'Copiado'; setTimeout(() => b.textContent = 'Copiar', 1800); };
  const sel = () => { const r = document.createRange(); r.selectNodeContents(document.getElementById('phone')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); };
  try { navigator.clipboard.writeText(t).then(done, sel); } catch (_) { sel(); }
});
</script>

</body>
</html>
